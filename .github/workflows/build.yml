
name: Build MCQ Video Studio Pro APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Prepare Environment
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

          if [ ! -f "gradlew" ]; then
            echo "ERROR: Gradle wrapper gradlew is missing."
            echo "Commit the Gradle wrapper files to the repository."
            exit 1
          fi

          chmod +x gradlew

      - name: Diagnose Android SDK
        run: |
          echo "Java version:"
          java -version

          echo "Android SDK location:"
          echo "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-not-set}}"

          echo "Installed SDK packages:"
          sdkmanager --list_installed

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mcq-video-studio-pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
