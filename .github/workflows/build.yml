name: Build MCQ Video Studio Pro APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Check or Generate google-services.json
        run: |
          if [ ! -f "app/google-services.json" ]; then
            PKG=$(grep -E "applicationId\s*[= ]+" app/build.gradle* 2>/dev/null | grep -v "applicationIdSuffix" | head -n 1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/' | tr -d '[:space:]')
            if [ -z "$PKG" ]; then
              PKG=$(grep -E "namespace\s*[= ]+" app/build.gradle* 2>/dev/null | head -n 1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/' | tr -d '[:space:]')
            fi
            if [ -z "$PKG" ]; then
              PKG="com.example.app"
            fi
            echo "Generating fallback app/google-services.json for package: $PKG"
            cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "mock-project-id",
              "storage_bucket": "mock-project-id.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1234567890123456",
                  "android_client_info": {
                    "package_name": "$PKG"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly123456789"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:6543210987654321",
                  "android_client_info": {
                    "package_name": "${PKG}.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly123456789"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Prepare Gradle Wrapper
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            cp gradle/wrapper/gradle-wrapper.properties /tmp/gradle-wrapper.properties.bak
          fi
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.12
          fi
          if [ -f "/tmp/gradle-wrapper.properties.bak" ]; then
            cp /tmp/gradle-wrapper.properties.bak gradle/wrapper/gradle-wrapper.properties
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m" 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=========================================="
            echo "CLEAN ERROR SUMMARY (COPY THIS SECTION):"
            echo "=========================================="
            grep -E "(> Task .* FAILED|^e: |FAILURE:|What went wrong:|^\* |^  > )" build.log | tail -n 60
            echo "### Build Error Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E -A 15 "(> Task .* FAILED|^e: |What went wrong:)" build.log | tail -n 80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MCQ-Video-Studio-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
